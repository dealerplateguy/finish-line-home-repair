# Finish Line Home Repair — production site (Cloudflare Worker, static assets)
# Same deploy pattern as the wreckedleads marketing site, separate Worker.
# Deploy:  cd production && wrangler deploy
name = "finish-line-home-repair"
# dealerplateguy@gmail.com's account — same one hosting the wreckedleads marketing
# site (NOT the CRC Website account). Deploy with the CRC env token excluded:
#   env -u CLOUDFLARE_API_TOKEN wrangler deploy
account_id = "2e2c59a11be87863cc1f65fd11c27905"
compatibility_date = "2026-06-01"
workers_dev = true  # keep the workers.dev URL alive alongside the custom domain

# Custom domains (zone: finishlinehomerepair.com, nameservers moved 2026-06-12).
# RE-ENABLE after deleting the imported Squarespace DNS records in the zone
# (apex A records + www CNAME) — attach fails with code 100117 while they exist.
# routes = [
#   { pattern = "finishlinehomerepair.com", custom_domain = true },
#   { pattern = "www.finishlinehomerepair.com", custom_domain = true }
# ]

[assets]
directory = "./public"
not_found_handling = "404-page"
